<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, sans-serif" role="img" aria-label="Krydsede agtertrosser mellem pæle: styrbord klampe til bagbord pæl og omvendt — længere liner, der arbejder bedre ved vandstandsændringer og holder agterenden centreret">
  <defs>
    <g id="baad">
      <path d="M -35 -13 L 15 -13 Q 38 0 15 13 L -35 13 Q -42 0 -35 -13 Z" fill="#0e7490"/>
      <circle cx="-18" cy="0" r="4" fill="#e0f2f7"/>
    </g>
  </defs>
  <rect width="600" height="400" fill="#e8f6fa"/>
  <rect y="330" width="600" height="70" fill="#94a3b8"/>
  <text x="16" y="372" fill="#334155" font-size="15" font-weight="700">KAJ</text>
  <circle cx="240" cy="336" r="6" fill="#334155"/>
  <circle cx="360" cy="336" r="6" fill="#334155"/>
  <circle cx="250" cy="160" r="9" fill="#8b5e34" stroke="#5d3f22" stroke-width="2"/>
  <circle cx="350" cy="160" r="9" fill="#8b5e34" stroke="#5d3f22" stroke-width="2"/>
  <g stroke="#0f3b4c" stroke-width="2.5" fill="none">
    <path d="M 313 227 L 252 168"/>
    <path d="M 287 227 L 348 168"/>
    <path d="M 287 277 L 240 330"/>
    <path d="M 313 277 L 360 330"/>
  </g>
  <use href="#baad" transform="translate(300 262) rotate(90)"/>
  <g fill="#0f3b4c" font-size="14" font-weight="700">
    <text x="26" y="46">Krydsede agtertrosser = længere liner,</text>
    <text x="26" y="66">der arbejder bedre ved vandstandsændringer</text>
    <text x="368" y="216">Krydset holder agterenden</text>
    <text x="368" y="236">midt i båsen</text>
    <text x="26" y="300">Pas på gnav, hvor</text>
    <text x="26" y="320">trosserne krydser</text>
  </g>
</svg>
