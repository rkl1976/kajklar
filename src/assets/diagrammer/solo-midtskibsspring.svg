<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, sans-serif" role="img" aria-label="Solo-teknik i pælebås: én trosse fra midtskibsklampen lægges over pælen på vej ind, og båden ligger stille, mens resten af fortøjningen sættes">
  <defs>
    <g id="baad">
      <path d="M -35 -13 L 15 -13 Q 38 0 15 13 L -35 13 Q -42 0 -35 -13 Z" fill="#0e7490"/>
      <circle cx="-18" cy="0" r="4" fill="#e0f2f7"/>
    </g>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="#e8f6fa"/>
  <rect y="330" width="600" height="70" fill="#94a3b8"/>
  <text x="16" y="372" fill="#334155" font-size="15" font-weight="700">KAJ</text>
  <circle cx="250" cy="175" r="9" fill="#8b5e34" stroke="#5d3f22" stroke-width="2"/>
  <circle cx="350" cy="175" r="9" fill="#8b5e34" stroke="#5d3f22" stroke-width="2"/>
  <path d="M 287 235 Q 262 210 252 183" fill="none" stroke="#0f3b4c" stroke-width="3"/>
  <use href="#baad" transform="translate(300 235) rotate(90)"/>
  <circle cx="300" cy="222" r="5" fill="#fef3e2" stroke="#b45309" stroke-width="2"/>
  <g fill="#0f3b4c" font-size="14" font-weight="700">
    <text x="26" y="60">1. Øje over pælen fra midtskibsklampen,</text>
    <text x="26" y="80">mens du glider forbi</text>
    <text x="368" y="150">2. Lad trossen løbe,</text>
    <text x="368" y="170">og brems blidt op</text>
    <text x="330" y="300">3. Båden ligger stille,</text>
    <text x="330" y="320">sæt resten i ro og mag</text>
  </g>
  <text x="26" y="386" fill="#1f2937" font-size="12" font-weight="700">Den lyse prik = dig, tæt på klampen og roret på samme tid</text>
</svg>
