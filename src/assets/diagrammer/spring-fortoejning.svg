<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, sans-serif" role="img" aria-label="Fortøjning langs kaj med fire trosser: fortrosse, agtertrosse, forspring og agterspring">
