<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="system-ui, sans-serif" role="img" aria-label="Midtfarvandsafmærkning: en bøje med røde og hvide lodrette striber og én rød kugle som topbetegnelse. Der er sejlbart vand hele vejen rundt, så du kan passere den på begge sider, her vist med en båd på hver side">
  <defs>
    <linearGradient id="vand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef8fb"/>
      <stop offset="1" stop-color="#d3ecf3"/>
    </linearGradient>
    <clipPath id="kort"><rect width="600" height="420" rx="18"/></clipPath>
    <filter id="skygge" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f3b4c" flood-opacity="0.22"/>
    </filter>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <g clip-path="url(#kort)">
    <rect width="600" height="420" fill="url(#vand)"/>
    <rect y="300" width="600" height="120" fill="#bfe3ee" opacity="0.5"/>
    <g stroke="#ffffff" stroke-width="2" opacity="0.45" fill="none" stroke-linecap="round">
      <path d="M 44 104 q 22 -7 44 0 t 44 0"/>
      <path d="M 468 104 q 22 -7 44 0 t 44 0"/>
    </g>

    <!-- Både der passerer på hver sin side -->
    <line x1="150" y1="300" x2="150" y2="160" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#pil)"/>
    <g filter="url(#skygge)" transform="translate(150 340)">
      <path d="M -18 22 L 18 22 L 18 -5 Q 0 -28 -18 -5 Z" fill="#0e7490"/>
      <circle cx="0" cy="6" r="4.5" fill="#e0f2f7"/>
    </g>
    <line x1="450" y1="300" x2="450" y2="160" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#pil)"/>
    <g filter="url(#skygge)" transform="translate(450 340)">
      <path d="M -18 22 L 18 22 L 18 -5 Q 0 -28 -18 -5 Z" fill="#0e7490"/>
      <circle cx="0" cy="6" r="4.5" fill="#e0f2f7"/>
    </g>

    <!-- Midtfarvandsbøje -->
    <g filter="url(#skygge)">
      <circle cx="300" cy="170" r="16" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
      <line x1="300" y1="186" x2="300" y2="212" stroke="#334155" stroke-width="3"/>
      <rect x="274" y="212" width="13" height="90" fill="#dc2626"/>
      <rect x="287" y="212" width="13" height="90" fill="#ffffff"/>
      <rect x="300" y="212" width="13" height="90" fill="#dc2626"/>
      <rect x="313" y="212" width="13" height="90" fill="#ffffff"/>
      <rect x="274" y="212" width="52" height="90" rx="10" fill="none" stroke="#334155" stroke-width="2"/>
    </g>

    <text x="300" y="332" text-anchor="middle" fill="#0f3b4c" font-size="17" font-weight="800">MIDTFARVAND</text>
    <text x="300" y="354" text-anchor="middle" fill="#475569" font-size="13">røde/hvide lodrette striber · rød kugle</text>
    <text x="300" y="374" text-anchor="middle" fill="#475569" font-size="13">sejlbart vand hele vejen rundt</text>
    <text x="300" y="394" text-anchor="middle" fill="#0f3b4c" font-size="14" font-weight="700">passér den på begge sider</text>
  </g>
  <rect x="1.25" y="1.25" width="597.5" height="417.5" rx="16.75" fill="none" stroke="#bcdfe9" stroke-width="2.5"/>
</svg>
