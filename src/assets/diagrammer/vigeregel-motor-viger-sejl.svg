<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, sans-serif" role="img" aria-label="Motorbåd viger for sejlbåd, der sejler for sejl. Motorbåden sætter farten ned og drejer bagom sejlbåden. Undtagelse: sejler sejlbåden for motor, gælder de almindelige motorbådsregler.">
  <defs>
    <linearGradient id="vand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef8fb"/>
      <stop offset="1" stop-color="#d3ecf3"/>
    </linearGradient>
    <clipPath id="kort"><rect width="600" height="400" rx="18"/></clipPath>
    <filter id="skygge" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f3b4c" flood-opacity="0.22"/>
    </filter>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#f59e0b"/>
    </marker>
    <marker id="pilg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
    <g id="baad">
      <path d="M -15 19 L 15 19 L 15 -4 Q 0 -28 -15 -4 Z" fill="#0e7490"/>
      <circle cx="0" cy="0" r="4" fill="#e0f2f7"/>
    </g>
  </defs>

  <g clip-path="url(#kort)">
    <rect width="600" height="400" fill="url(#vand)"/>
    <rect y="300" width="600" height="100" fill="#bfe3ee" opacity="0.45"/>

    <line x1="400" y1="150" x2="200" y2="150" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#pilg)"/>
    <g filter="url(#skygge)" transform="translate(430 150) rotate(270)">
      <path d="M -15 19 L 15 19 L 15 -4 Q 0 -26 -15 -4 Z" fill="#475569"/>
      <line x1="0" y1="-4" x2="0" y2="-74" stroke="#334155" stroke-width="3"/>
      <path d="M -3 -70 L -3 -12 L -40 -12 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M 3 -60 L 3 -12 L 28 -12 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    </g>

    <line x1="250" y1="300" x2="250" y2="172" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.5"/>
    <circle cx="250" cy="150" r="12" fill="#dc2626" filter="url(#skygge)"/>
    <text x="250" y="155" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">!</text>

    <path d="M 258 306 Q 340 258 350 188 Q 354 150 348 118" fill="none" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#pil)"/>
    <use href="#baad" filter="url(#skygge)" transform="translate(250 330)"/>

    <g font-size="14" font-weight="800" text-anchor="middle">
      <text x="470" y="120" fill="#475569">SEJLBÅD · står på</text>
      <text x="205" y="330" fill="#0e7490">DU VIGER</text>
    </g>
    <text x="300" y="360" text-anchor="middle" fill="#0f3b4c" font-size="15" font-weight="800">Motorbåd viger for sejlbåd (for sejl)</text>
    <text x="300" y="382" text-anchor="middle" fill="#475569" font-size="13">Undtagelse: sejler sejlbåden for motor, gælder de almindelige regler</text>
  </g>
  <rect x="1.25" y="1.25" width="597.5" height="397.5" rx="16.75" fill="none" stroke="#bcdfe9" stroke-width="2.5"/>
</svg>
