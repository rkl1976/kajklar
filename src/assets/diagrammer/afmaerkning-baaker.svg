<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="system-ui, sans-serif" role="img" aria-label="Båker og overrettemærker (fyrlinje): to faste båker på land, en lav forreste og en høj bageste. Til venstre står de forskudt ved siden af hinanden, så båden er ude af kurs. Til højre står de lige over hinanden i ét, så båden følger den sikre linje ind">
  <!-- Vand -->
  <rect width="720" height="430" fill="#e8f6fa"/>
  <!-- Land øverst -->
  <rect width="720" height="70" fill="#cde3b5"/>
  <rect y="62" width="720" height="12" fill="#e9d8a6"/>
  <text x="20" y="34" fill="#5b7a3a" font-size="14" font-weight="700">LAND</text>

  <!-- Skillelinje mellem de to paneler -->
  <line x1="360" y1="90" x2="360" y2="360" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- ===================== VENSTRE: UDE AF KURS ===================== -->
  <!-- bageste båke (høj), forskudt -->
  <line x1="215" y1="74" x2="215" y2="150" stroke="#334155" stroke-width="4"/>
  <path d="M 215 96 L 199 74 L 231 74 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  <!-- forreste båke (lav), forskudt til den anden side -->
  <line x1="150" y1="74" x2="150" y2="210" stroke="#334155" stroke-width="4"/>
  <path d="M 150 170 L 134 200 L 166 200 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  <!-- båd ude af kurs -->
  <g transform="translate(120 330)">
    <path d="M -18 22 L 18 22 L 18 -5 Q 0 -28 -18 -5 Z" fill="#0e7490"/>
    <circle cx="0" cy="6" r="4.5" fill="#e0f2f7"/>
  </g>
  <text x="180" y="392" text-anchor="middle" fill="#0f3b4c" font-size="15" font-weight="800">UDE AF KURS</text>
  <text x="180" y="413" text-anchor="middle" fill="#475569" font-size="13">båkerne står ved siden af hinanden</text>

  <!-- ===================== HØJRE: PÅ RETTE KURS ===================== -->
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#f59e0b"/>
    </marker>
  </defs>
  <!-- fyrlinjen -->
  <line x1="540" y1="340" x2="540" y2="120" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#pil)"/>
  <!-- bageste båke (høj) -->
  <line x1="540" y1="74" x2="540" y2="150" stroke="#334155" stroke-width="4"/>
  <path d="M 540 96 L 524 74 L 556 74 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  <!-- forreste båke (lav), samme linje -->
  <path d="M 540 170 L 524 200 L 556 200 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  <!-- båd på linjen -->
  <g transform="translate(540 360)">
    <path d="M -18 22 L 18 22 L 18 -5 Q 0 -28 -18 -5 Z" fill="#0e7490"/>
    <circle cx="0" cy="6" r="4.5" fill="#e0f2f7"/>
  </g>
  <text x="540" y="392" text-anchor="middle" fill="#0f3b4c" font-size="15" font-weight="800">PÅ RETTE KURS</text>
  <text x="540" y="413" text-anchor="middle" fill="#475569" font-size="13">båkerne står lige over hinanden, "i ét"</text>
</svg>
