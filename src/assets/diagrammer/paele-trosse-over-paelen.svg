<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, sans-serif" role="img" aria-label="Trossens øje lægges over pælen, mens båden glider forbi mod kajen">
  <defs>
    <g id="baad">
      <path d="M -35 -13 L 15 -13 Q 38 0 15 13 L -35 13 Q -42 0 -35 -13 Z" fill="#0e7490"/>
      <circle cx="-18" cy="0" r="4" fill="#e0f2f7"/>
    </g>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="#e8f6fa"/>
  <rect y="330" width="600" height="70" fill="#94a3b8"/>
  <text x="16" y="372" fill="#334155" font-size="15" font-weight="700">KAJ</text>
  <circle cx="210" cy="190" r="16" fill="#8b5e34" stroke="#5d3f22" stroke-width="3"/>
  <ellipse cx="210" cy="188" rx="24" ry="14" fill="none" stroke="#b45309" stroke-width="3.5"/>
  <path d="M 232 182 Q 262 168 287 175" fill="none" stroke="#b45309" stroke-width="3.5"/>
  <use href="#baad" transform="translate(300 210) rotate(90)"/>
  <path d="M 300 258 L 300 302" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#pil)"/>
  <g fill="#0f3b4c" font-size="14" font-weight="700">
    <text x="36" y="120">Øjet over pælen — ikke et knob</text>
    <text x="330" y="150">Trossen løber frit ud,</text>
    <text x="330" y="170">mens båden glider frem</text>
    <text x="326" y="292">Boven fortsætter mod kaj</text>
  </g>
</svg>
