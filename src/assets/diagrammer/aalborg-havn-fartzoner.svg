<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, sans-serif" role="img" aria-label="Skitse over Aalborg Havns fartzoner: 6 knob-området dækker havnefronten fra Norden Bro til Portland, Nørresundby Havn samt Nordlige og Østlige Erhvervshavn, 3 knob i bassinerne. Uden for havneområdet gælder ingen fast knob-grænse i renden.">
  <rect width="600" height="400" fill="#e8f6fa"/>
  <path d="M 0 0 H 600 V 140 Q 500 128 400 138 Q 300 150 200 142 Q 100 134 0 142 Z" fill="#94a3b8"/>
  <path d="M 0 400 H 600 V 268 Q 500 278 400 262 Q 300 248 200 256 Q 100 266 0 260 Z" fill="#94a3b8"/>
  <text x="240" y="60" fill="#334155" font-size="16" font-weight="700">NØRRESUNDBY</text>
  <text x="240" y="356" fill="#334155" font-size="16" font-weight="700">AALBORG</text>
  <text x="20" y="205" fill="#64748b" font-size="12" font-weight="700">← mod Nibe</text>
  <text x="508" y="205" fill="#64748b" font-size="12" font-weight="700">mod Hals →</text>

  <!-- 6 knob-zoner (skraveret teal langs kysterne) -->
  <rect x="60" y="238" width="245" height="30" fill="#0e7490" opacity="0.4"/>
  <rect x="193" y="132" width="36" height="26" fill="#0e7490" opacity="0.4"/>
  <rect x="450" y="126" width="24" height="28" fill="#0e7490" opacity="0.4"/>
  <rect x="468" y="242" width="100" height="30" fill="#0e7490" opacity="0.4"/>

  <!-- Broer og tunnel -->
  <line x1="160" y1="140" x2="160" y2="262" stroke="#475569" stroke-width="5"/>
  <line x1="196" y1="138" x2="196" y2="260" stroke="#475569" stroke-width="5"/>
  <line x1="293" y1="136" x2="293" y2="258" stroke="#475569" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="108" y="120" fill="#334155" font-size="11" font-weight="700">Jernbanebroen</text>
  <text x="186" y="104" fill="#334155" font-size="11" font-weight="700">Limfjordsbroen</text>
  <text x="255" y="120" fill="#334155" font-size="11" font-weight="700">Tunnelen</text>
  <text x="255" y="133" fill="#64748b" font-size="10" font-weight="700">(ankring forbudt)</text>

  <!-- Zone-labels -->
  <text x="66" y="290" fill="#0c5f77" font-size="11" font-weight="700">Centrale Erhvervshavn + havnefronten</text>
  <text x="150" y="172" fill="#0c5f77" font-size="11" font-weight="700">Nørresundby Havn</text>
  <text x="404" y="118" fill="#0c5f77" font-size="11" font-weight="700">Nordlige Erhvervshavn</text>
  <text x="462" y="292" fill="#0c5f77" font-size="11" font-weight="700">Østlige Erhvervshavn</text>

  <!-- Forklaring -->
  <rect x="20" y="14" width="196" height="52" rx="8" fill="#ffffff" opacity="0.92"/>
  <rect x="30" y="26" width="18" height="12" fill="#0e7490" opacity="0.4"/>
  <text x="54" y="36" fill="#0f3b4c" font-size="11" font-weight="700">Havnens område: højst 6 knob</text>
  <text x="54" y="52" fill="#0f3b4c" font-size="11">,  i bassinerne højst 3 knob</text>

  <text x="20" y="384" fill="#1f2937" font-size="11" font-weight="700">Skitse, ikke et søkort. Præcise grænser: ordensreglementets bilag 1-4 (koordinater og officielle kort).</text>
</svg>
