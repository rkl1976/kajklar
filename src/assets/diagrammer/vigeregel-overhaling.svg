<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, sans-serif" role="img" aria-label="Overhaling: den overhalende motorbåd bagfra har vigepligt og skal passere den langsommere båd med god afstand, uanset hvad den forankørende sejler for.">
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#f59e0b"/>
    </marker>
    <g id="baad">
      <path d="M -15 19 L 15 19 L 15 -4 Q 0 -28 -15 -4 Z" fill="#0e7490"/>
      <circle cx="0" cy="7" r="4" fill="#e0f2f7"/>
    </g>
    <g id="baad2">
      <path d="M -15 19 L 15 19 L 15 -4 Q 0 -28 -15 -4 Z" fill="#475569"/>
      <circle cx="0" cy="7" r="4" fill="#e0f2f7"/>
    </g>
  </defs>
  <rect width="600" height="400" fill="#e8f6fa"/>

  <!-- Den langsomme båd forude, sejler ligeud -->
  <line x1="360" y1="200" x2="360" y2="90" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.7"/>
  <use href="#baad2" transform="translate(360 210)"/>

  <!-- Den overhalende viger udenom med god afstand -->
  <path d="M 360 320 Q 250 265 250 175 Q 250 95 355 62" fill="none" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#pil)"/>
  <use href="#baad" transform="translate(360 335)"/>
  <!-- fartstreger bag den hurtige -->
  <g stroke="#0e7490" stroke-width="2.5" opacity="0.5" stroke-linecap="round">
    <line x1="345" y1="368" x2="345" y2="384"/>
    <line x1="360" y1="370" x2="360" y2="388"/>
    <line x1="375" y1="368" x2="375" y2="384"/>
  </g>

  <g font-size="14" font-weight="800" text-anchor="middle">
    <text x="360" y="176" fill="#475569">LANGSOM · står på</text>
    <text x="425" y="340" fill="#0e7490">DU OVERHALER</text>
  </g>
  <text x="300" y="378" text-anchor="middle" fill="#0f3b4c" font-size="15" font-weight="800">Den overhalende viger altid, hold god afstand hele vejen forbi</text>
</svg>
