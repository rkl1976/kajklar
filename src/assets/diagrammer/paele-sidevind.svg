<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, sans-serif" role="img" aria-label="Sidevind i pælebåsen: tag trossen på luv-pælen først, så vinden ikke sætter båden ned på læ-pælen eller naboen">
  <defs>
    <g id="baad">
      <path d="M -35 -13 L 15 -13 Q 38 0 15 13 L -35 13 Q -42 0 -35 -13 Z" fill="#0e7490"/>
      <circle cx="-18" cy="0" r="4" fill="#e0f2f7"/>
    </g>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="#e8f6fa"/>
  <rect y="330" width="600" height="70" fill="#94a3b8"/>
  <text x="16" y="372" fill="#334155" font-size="15" font-weight="700">KAJ</text>
  <g stroke="#f59e0b" stroke-width="3" marker-end="url(#pil)">
    <line x1="35" y1="130" x2="90" y2="130"/>
    <line x1="35" y1="170" x2="90" y2="170"/>
    <line x1="35" y1="210" x2="90" y2="210"/>
  </g>
  <text x="38" y="108" fill="#b45309" font-size="14" font-weight="700">VIND</text>
  <circle cx="250" cy="175" r="9" fill="#8b5e34" stroke="#5d3f22" stroke-width="2"/>
  <circle cx="350" cy="175" r="9" fill="#8b5e34" stroke="#5d3f22" stroke-width="2"/>
  <text x="222" y="152" fill="#475569" font-size="12" font-weight="700">LUV</text>
  <text x="342" y="152" fill="#475569" font-size="12" font-weight="700">LÆ</text>
  <path d="M 287 205 Q 264 196 252 183" fill="none" stroke="#0f3b4c" stroke-width="3"/>
  <use href="#baad" transform="translate(300 240) rotate(90)"/>
  <line x1="322" y1="252" x2="360" y2="252" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#pil)"/>
  <g fill="#0f3b4c" font-size="14" font-weight="700">
    <text x="130" y="60">1. Trosse på LUV-pælen først</text>
    <text x="368" y="110">Vinden presser båden mod læ,</text>
    <text x="368" y="130">trossen holder dig fri af naboen</text>
    <text x="340" y="310">2. Derefter læ-pæl og forende</text>
  </g>
</svg>
