<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="system-ui, sans-serif" role="img" aria-label="Til venstre isoleret fare-afmærkning: sort bøje med rødt bånd og to sorte kugler som topfigur, som du kan sejle udenom hele vejen rundt. Til højre specialafmærkning: gul bøje med gult kryds som topfigur, der markerer for eksempel badezoner, kabler og ankerforbud">
  <rect width="600" height="430" fill="#e8f6fa"/>
  <rect y="300" width="600" height="130" fill="#bae5ef" opacity="0.55"/>

  <!-- ============ ISOLERET FARE (cx=170) ============ -->
  <ellipse cx="170" cy="300" rx="44" ry="11" fill="#0e7490" opacity="0.15"/>
  <circle cx="170" cy="158" r="14" fill="#1f2937"/>
  <circle cx="170" cy="192" r="14" fill="#1f2937"/>
  <line x1="170" y1="206" x2="170" y2="212" stroke="#334155" stroke-width="3"/>
  <rect x="142" y="212" width="56" height="98" rx="12" fill="#1f2937" stroke="#0f172a" stroke-width="2"/>
  <rect x="142" y="248" width="56" height="26" fill="#dc2626"/>
  <rect x="142" y="212" width="56" height="98" rx="12" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="170" y="340" text-anchor="middle" fill="#0f3b4c" font-size="16" font-weight="800">ISOLERET FARE</text>
  <text x="170" y="362" text-anchor="middle" fill="#475569" font-size="13">sort med rødt bånd</text>
  <text x="170" y="380" text-anchor="middle" fill="#475569" font-size="13">to sorte kugler i toppen</text>
  <text x="170" y="398" text-anchor="middle" fill="#475569" font-size="13">sejl udenom hele vejen rundt</text>

  <!-- ============ SPECIALAFMÆRKNING (cx=430) ============ -->
  <ellipse cx="430" cy="300" rx="44" ry="11" fill="#0e7490" opacity="0.15"/>
  <!-- Gult kryds (X) med mørk kant -->
  <path d="M 415 154 L 445 190 M 445 154 L 415 190" stroke="#a16207" stroke-width="10" stroke-linecap="round"/>
  <path d="M 415 154 L 445 190 M 445 154 L 415 190" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
  <line x1="430" y1="192" x2="430" y2="212" stroke="#334155" stroke-width="3"/>
  <rect x="402" y="212" width="56" height="98" rx="12" fill="#facc15" stroke="#a16207" stroke-width="2"/>
  <text x="430" y="340" text-anchor="middle" fill="#0f3b4c" font-size="16" font-weight="800">SPECIALAFMÆRKNING</text>
  <text x="430" y="362" text-anchor="middle" fill="#475569" font-size="13">gul med gult kryds</text>
  <text x="430" y="380" text-anchor="middle" fill="#475569" font-size="13">badezone, kabel, ankerforbud m.m.</text>
</svg>
