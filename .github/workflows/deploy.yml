name: Deploy til GitHub Pages

on:
  push:
    branches: [feature/til-kaj-v1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Tillad kun ét samtidigt deploy; afbryd ikke et igangværende produktions-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build med Astro
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
